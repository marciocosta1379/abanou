<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo arredondado -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#fef1e8"/>
  <!-- Pata (laranja) -->
  <g fill="#e8651a">
    <!-- Almofada central -->
    <path d="M50 52
             C61 52 70 60 70 70
             C70 80 61 84 50 84
             C39 84 30 80 30 70
             C30 60 39 52 50 52 Z"/>
    <!-- Dedos -->
    <ellipse cx="33" cy="46" rx="8" ry="11"/>
    <ellipse cx="50" cy="40" rx="8.5" ry="12"/>
    <ellipse cx="67" cy="46" rx="8" ry="11"/>
  </g>
  <!-- Selo de aprovação (check teal) -->
  <circle cx="76" cy="74" r="16" fill="#ffffff" stroke="#0fa89c" stroke-width="3.5"/>
  <polyline points="68,74 74,81 85,67" stroke="#0fa89c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
